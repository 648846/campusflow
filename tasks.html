            <div>

                <option value="软件工程">软件工程</option>
                <option value="操作系统">操作系统</option>

            </div>
            
            <div>

                <option value="medium" selected>中优先级</option>
                <option value="low">低优先级</option>

            <div>

  <script>
    let tasks = [];
    
    function loadTasks() {
      const savedTasks = localStorage.getItem('campusflow_tasks');
      if (savedTasks) {
        tasks = JSON.parse(savedTasks);
      } else {
        tasks = [
          { id: 1, title: '完成数据结构作业', course: '数据结构与算法', priority: 'high', dueDate: '今天 18:00', completed: false },
          { id: 2, title: '复习线性代数第三章', course: '线性代数', priority: 'medium', dueDate: '明天 10:00', completed: false },
          { id: 3, title: '准备计算机网络实验报告', course: '计算机网络', priority: 'high', dueDate: '后天 14:00', completed: false },
          { id: 4, title: '数据库课程设计', course: '数据库原理', priority: 'medium', dueDate: '周五 16:00', completed: false },
          { id: 5, title: '阅读软件工程论文', course: '软件工程', priority: 'low', dueDate: '下周', completed: false },
          { id: 6, title: '操作系统实验', course: '操作系统', priority: 'high', dueDate: '今天 20:00', completed: false }
        ];
        saveTasks();
      }
    }

    function saveTasks() {
      try {
        localStorage.setItem('campusflow_tasks', JSON.stringify(tasks));
        return true;
      } catch (error) {
        console.error('保存任务失败:', error);
        return false;
      }
    }

    function openAddTaskModal() {
      const modal = document.getElementById('addTaskModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      document.getElementById('taskTitle').focus();
    }

    function closeAddTaskModal() {
      const modal = document.getElementById('addTaskModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      document.getElementById('addTaskForm').reset();
    }

    function handleAddTask(event) {
      event.preventDefault();
      
      try {
        const title = document.getElementById('taskTitle').value.trim();
        const course = document.getElementById('taskCourse').value;
        const priority = document.getElementById('taskPriority').value;
        const estimate = Number(document.getElementById('taskEstimate').value) || 25;
        const dueDate = document.getElementById('taskDueDate').value;
        
        if (!title) {
          showNotification('错误', '请输入任务标题', 'error');
          return;
        }
        
        if (!course) {
          showNotification('错误', '请选择相关课程', 'error');
          return;
        }
        
        const newTask = {
          id: Date.now(),
          title: title,
          course: course,
          priority: priority,
          dueDate: formatDueDate(dueDate),
          due: dueDate,          // 结构化截止时间，供智能排程使用
          estimate: estimate,    // 预计时长（分钟）
          completed: false
        };
        
        tasks.unshift(newTask);
        
        if (saveTasks()) {
          renderTaskList();
          closeAddTaskModal();
          showNotification('成功', '任务添加成功', 'success');
        } else {
          showNotification('错误', '保存任务失败，请重试', 'error');
        }
      } catch (error) {
        console.error('添加任务失败:', error);
        showNotification('错误', '添加任务时发生错误', 'error');
      }
    }

    function formatDueDate(dateString) {
      try {
        const date = new Date(dateString);
        const now = new Date();
        const diffMs = date - now;
        const diffHours = Math.floor(diffMs / (1000 * 60 * 60));
        const diffDays = Math.floor(diffHours / 24);
        
        if (diffDays === 0) {
          return `今天 ${date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })}`;
        } else if (diffDays === 1) {
          return `明天 ${date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })}`;
        } else if (diffDays === 2) {
          return `后天 ${date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })}`;
        } else {
          return date.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        }
      } catch (error) {
        return dateString;
      }
    }

    function showNotification(title, message, type = 'success') {
      const notification = document.getElementById('notification');
      const icon = document.getElementById('notificationIcon');
      const titleEl = document.getElementById('notificationTitle');
      const messageEl = document.getElementById('notificationMessage');
      
      titleEl.textContent = title;
      messageEl.textContent = message;
      
      if (type === 'success') {
        icon.innerHTML = '<svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>';
        icon.className = 'w-8 h-8 rounded-full flex items-center justify-center bg-success';
      } else {
        icon.innerHTML = '<svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>';
        icon.className = 'w-8 h-8 rounded-full flex items-center justify-center bg-danger';
      }
      
      notification.classList.remove('hidden');
      
      setTimeout(function() {
        notification.classList.add('hidden');
      }, 3000);
    }

    function renderTaskList() {
      const container = document.getElementById('taskList');
      
      if (tasks.length === 0) {
        container.innerHTML = `
          <div class="text-center py-12">
            <svg class="w-16 h-16 mx-auto text-gray-300 dark:text-gray-600 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4m6 2l-2-2-4 4"></path>
            </svg>
            <p class="text-gray-500 dark:text-gray-400">暂无任务</p>
            <p class="text-sm text-gray-400 dark:text-gray-500">点击"添加任务"开始创建</p>
          </div>
        `;
        return;
      }
      
      container.innerHTML = tasks.map(function(task) {
        return `
        <div class="task-card p-4 rounded-xl bg-white dark:bg-darkLighter border border-gray-100 dark:border-gray-700 priority-${task.priority}">
          <div class="flex items-start gap-3 sm:gap-4">
            <input type="checkbox" ${task.completed ? 'checked' : ''} class="mt-1 w-5 h-5 rounded border-gray-300 text-primary focus:ring-primary cursor-pointer" onchange="toggleTask(${task.id})">
            <div class="flex-1 min-w-0">
              <h4 class="font-semibold text-gray-900 dark:text-white ${task.completed ? 'line-through opacity-50' : ''}">${task.title}</h4>
              <div class="flex flex-wrap items-center gap-x-3 gap-y-1 mt-2 text-sm text-gray-500 dark:text-gray-400">
                <span class="flex items-center gap-1 whitespace-nowrap">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332-.477-4.5-1.253"></path>
                  </svg>
                  ${task.course}
                </span>
                <span class="flex items-center gap-1 whitespace-nowrap">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                  </svg>
                  ${task.dueDate}
                </span>
                <span class="flex items-center gap-1 whitespace-nowrap">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2"></path>
                  </svg>
                  ${task.estimate || 25} 分钟
                </span>
              </div>
            </div>
            <div class="flex items-center gap-1 flex-shrink-0">
            <button onclick="deleteTask(${task.id})" class="p-2 hover:bg-red-50 dark:hover:bg-red-900/20 rounded-lg transition-colors group">
              <svg class="w-4 h-4 text-gray-400 group-hover:text-danger" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
              </svg>
            </button>
            <span class="px-2 sm:px-3 py-1 rounded-full text-xs font-medium whitespace-nowrap ${
              task.priority === 'high' ? 'bg-danger/10 text-danger' :
              task.priority === 'medium' ? 'bg-accent/10 text-accent' :
              'bg-success/10 text-success'
            }">
              ${task.priority === 'high' ? '高优先级' : task.priority === 'medium' ? '中优先级' : '低优先级'}
            </span>
            </div>
          </div>
        </div>
      `}).join('');
      
      updateTaskStats();
    }

    function toggleTask(taskId) {
      const task = tasks.find(function(t) { return t.id === taskId; });
      if (task) {
        task.completed = !task.completed;
        if (saveTasks()) {
          renderTaskList();
          showNotification('更新', task.completed ? '任务已完成' : '任务已恢复', 'success');
        }
      }
    }

    function deleteTask(taskId) {
      if (confirm('确定要删除这个任务吗？')) {
        tasks = tasks.filter(function(t) { return t.id !== taskId; });
        if (saveTasks()) {
          renderTaskList();
          showNotification('删除', '任务已删除', 'success');
        }
      }
    }

    function updateTaskStats() {
      const total = tasks.length;
      const completed = tasks.filter(function(t) { return t.completed; }).length;
      const inProgress = total - completed;
      const high = tasks.filter(function(t) { return t.priority === 'high'; }).length;
      const medium = tasks.filter(function(t) { return t.priority === 'medium'; }).length;
      const low = tasks.filter(function(t) { return t.priority === 'low'; }).length;
      
      document.getElementById('totalTasks').textContent = total;
      document.getElementById('completedTasks').textContent = completed;
      document.getElementById('inProgressTasks').textContent = inProgress;
      document.getElementById('highPriorityCount').textContent = high;
      document.getElementById('mediumPriorityCount').textContent = medium;
      document.getElementById('lowPriorityCount').textContent = low;
    }

    function navigateTo(page) {
      window.location.href = page;
    }

    function initTheme() {
      const themeToggle = document.getElementById('themeToggle');
      const isDark = localStorage.getItem('theme') === 'dark' || 
                     (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
      
      if (isDark) {
        document.documentElement.classList.add('dark');
      }
      
      themeToggle.addEventListener('click', function() {
        document.documentElement.classList.toggle('dark');
        localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
      });
    }

    document.addEventListener('DOMContentLoaded', function() {
      initTheme();
      CF.seedIfEmpty();
      loadTasks();
      renderTaskList();
    });
  </script>
</body>
</html>
