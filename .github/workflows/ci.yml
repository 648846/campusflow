name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: 算法单测 + 资源完整性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 排程引擎单元测试
        run: node tests/scheduler.test.js

      - name: 站内引用与离线完整性检查
        run: node scripts/check-assets.js
