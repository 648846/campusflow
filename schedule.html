    <div id="importModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden items-center justify-center">
      <div class="glass dark:glass-dark rounded-2xl p-6 w-full max-w-lg mx-4 transform transition-all">
        <div class="flex items-center justify-between mb-6">
          <h3 class="text-xl font-bold text-gray-900 dark:text-white">添加课程</h3>
          <button onclick="closeImportModal()" class="p-2 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-lg transition-colors">
            <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
          </button>
        </div>
        
        <div class="mb-6">
          <div class="flex border-b border-gray-200 dark:border-gray-700">
            <button onclick="switchImportTab('manual')" id="manualTab" class="flex-1 py-3 text-sm font-medium text-primary border-b-2 border-primary">
              手动添加
            </button>
            <button onclick="switchImportTab('import')" id="importTab" class="flex-1 py-3 text-sm font-medium text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-300">
              导入数据
            </button>
          </div>
        </div>
        
        <div id="manualForm">
          <form onsubmit="handleAddCourse(event)">
            <div class="space-y-4">
              <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">课程名称</label>
                <input type="text" id="courseName" required class="w-full px-4 py-2 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-darkLighter text-gray-900 dark:text-white focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all" placeholder="输入课程名称">
              </div>
              
              <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">课程分类</label>
                <select id="courseCategory" required class="w-full px-4 py-2 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-darkLighter text-gray-900 dark:text-white focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all">
                  <option value="">选择分类</option>
                  <option value="物联网工程">物联网工程</option>
                  <option value="数学">数学</option>
                  <option value="物理">物理</option>
                  <option value="化学">化学</option>
                  <option value="英语">英语</option>
                  <option value="其他">其他</option>
                </select>
              </div>
              
              <div class="grid grid-cols-2 gap-4">
                <div>
                  <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">学分</label>
                  <input type="number" id="courseCredits" min="1" max="10" required class="w-full px-4 py-2 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-darkLighter text-gray-900 dark:text-white focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all" placeholder="学分">
                </div>
                
                <div>
                  <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">上课时间</label>
                  <input type="text" id="courseTime" required class="w-full px-4 py-2 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-darkLighter text-gray-900 dark:text-white focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all" placeholder="如：周一 09:00">
                </div>
              </div>
              
              <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">上课地点</label>
                <input type="text" id="courseLocation" required class="w-full px-4 py-2 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-darkLighter text-gray-900 dark:text-white focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all" placeholder="如：A101">
              </div>
            </div>
            
            <div class="flex gap-3 mt-6">
              <button type="button" onclick="closeImportModal()" class="flex-1 px-4 py-2 border border-gray-200 dark:border-gray-700 text-gray-700 dark:text-gray-300 rounded-xl hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors">
                取消
              </button>
              <button type="submit" class="flex-1 px-4 py-2 bg-gradient-to-r from-primary to-secondary text-white rounded-xl hover:shadow-glow transition-all hover-lift">
                添加课程

            </div>
          </form>
        </div>
        
        <div id="importForm" class="hidden">
          <div class="space-y-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">粘贴课程数据 (JSON格式)</label>
              <textarea id="courseData" rows="8" class="w-full px-4 py-2 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-darkLighter text-gray-900 dark:text-white focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all font-mono text-sm" placeholder='[{"name": "高等数学", "category": "数学", "credits": 4, "time": "周一 08:00", "location": "A101"}]'></textarea>
            </div>
            
            <div class="bg-blue-50 dark:bg-blue-900/20 rounded-xl p-4">
              <h4 class="font-medium text-blue-900 dark:text-blue-300 mb-2">数据格式示例：</h4>
              <pre class="text-xs text-blue-800 dark:text-blue-400 overflow-x-auto">[
  {
    "name": "高等数学",
    "category": "数学", 
    "credits": 4,
    "time": "周一 08:00",
    "location": "A101"
  }
]</pre>
            </div>
            
            <div class="flex gap-3">
              <button type="button" onclick="closeImportModal()" class="flex-1 px-4 py-2 border border-gray-200 dark:border-gray-700 text-gray-700 dark:text-gray-300 rounded-xl hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors">
                取消
              </button>
              <button type="button" onclick="handleImportCourses()" class="flex-1 px-4 py-2 bg-gradient-to-r from-primary to-secondary text-white rounded-xl hover:shadow-glow transition-all hover-lift">
                导入课程

            </div>
          </div>
        </div>

    <div id="notification" class="fixed top-4 right-4 z-50 hidden">

        <div id="notificationIcon" class="w-8 h-8 rounded-full flex items-center justify-center">
        </div>
        <div>
          <p id="notificationTitle" class="font-medium text-gray-900 dark:text-white"></p>
          <p id="notificationMessage" class="text-sm text-gray-500 dark:text-gray-400"></p>
        </div>
      </div>

  <script>
    let courses = [];
    const colorClasses = [
      'from-blue-500 to-blue-600',
      'from-purple-500 to-purple-600',
      'from-green-500 to-green-600',
      'from-orange-500 to-orange-600',
      'from-pink-500 to-pink-600',
      'from-indigo-500 to-indigo-600',
      'from-teal-500 to-teal-600',
      'from-red-500 to-red-600'
    ];
    
    function loadCourses() {
      const savedCourses = localStorage.getItem('campusflow_courses');
      if (savedCourses) {
        courses = JSON.parse(savedCourses);
      } else {
        courses = [
          { id: 1, name: '数据结构与算法', category: '物联网工程', progress: 85, time: '周一 09:00', location: 'A101', color: 'from-blue-500 to-blue-600', credits: 4 },
          { id: 2, name: '线性代数', category: '数学', progress: 72, time: '周一 10:30', location: 'B203', color: 'from-purple-500 to-purple-600', credits: 3 },
          { id: 3, name: '计算机网络', category: '物联网工程', progress: 60, time: '周二 14:00', location: 'A205', color: 'from-green-500 to-green-600', credits: 4 },
          { id: 4, name: '数据库原理', category: '物联网工程', progress: 45, time: '周二 15:30', location: 'C301', color: 'from-orange-500 to-orange-600', credits: 3 },
          { id: 5, name: '软件工程', category: '物联网工程', progress: 90, time: '周三 08:00', location: 'D401', color: 'from-pink-500 to-pink-600', credits: 4 },
          { id: 6, name: '操作系统', category: '物联网工程', progress: 55, time: '周三 11:00', location: 'A302', color: 'from-indigo-500 to-indigo-600', credits: 4 },
          { id: 7, name: '概率论与数理统计', category: '数学', progress: 30, time: '周四 16:00', location: 'B105', color: 'from-teal-500 to-teal-600', credits: 3 },
          { id: 8, name: '人工智能导论', category: '物联网工程', progress: 20, time: '周四 17:30', location: 'C205', color: 'from-red-500 to-red-600', credits: 3 }
        ];
        saveCourses();
      }
    }

    function saveCourses() {
      try {
        localStorage.setItem('campusflow_courses', JSON.stringify(courses));
        return true;
      } catch (error) {
        console.error('保存课程失败:', error);
        return false;
      }
    }

    function openImportModal() {
      const modal = document.getElementById('importModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      document.getElementById('courseName').focus();
    }

    function closeImportModal() {
      const modal = document.getElementById('importModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      document.getElementById('courseName').value = '';
      document.getElementById('courseData').value = '';
    }

    function switchImportTab(tab) {
      const manualTab = document.getElementById('manualTab');
      const importTab = document.getElementById('importTab');
      const manualForm = document.getElementById('manualForm');
      const importForm = document.getElementById('importForm');
      
      if (tab === 'manual') {
        manualTab.classList.add('text-primary', 'border-b-2', 'border-primary');
        manualTab.classList.remove('text-gray-500', 'dark:text-gray-400');
        importTab.classList.remove('text-primary', 'border-b-2', 'border-primary');
        importTab.classList.add('text-gray-500', 'dark:text-gray-400');
        manualForm.classList.remove('hidden');
        importForm.classList.add('hidden');
      } else {
        importTab.classList.add('text-primary', 'border-b-2', 'border-primary');
        importTab.classList.remove('text-gray-500', 'dark:text-gray-400');
        manualTab.classList.remove('text-primary', 'border-b-2', 'border-primary');
        manualTab.classList.add('text-gray-500', 'dark:text-gray-400');
        importForm.classList.remove('hidden');
        manualForm.classList.add('hidden');
      }
    }

    function handleAddCourse(event) {
      event.preventDefault();
      
      try {
        const name = document.getElementById('courseName').value.trim();
        const category = document.getElementById('courseCategory').value;
        const credits = parseInt(document.getElementById('courseCredits').value);
        const time = document.getElementById('courseTime').value.trim();
        const location = document.getElementById('courseLocation').value.trim();
        
        if (!name) {
          showNotification('错误', '请输入课程名称', 'error');
          return;
        }
        
        if (!category) {
          showNotification('错误', '请选择课程分类', 'error');
          return;
        }
        
        const newCourse = {
          id: Date.now(),
          name: name,
          category: category,
          progress: 0,
          time: time,
          location: location,
          color: colorClasses[courses.length % colorClasses.length],
          credits: credits
        };
        
        courses.unshift(newCourse);
        
        if (saveCourses()) {
          renderCourseList();
          closeImportModal();
          showNotification('成功', '课程添加成功', 'success');
        } else {
          showNotification('错误', '保存课程失败，请重试', 'error');
        }
      } catch (error) {
        console.error('添加课程失败:', error);
        showNotification('错误', '添加课程时发生错误', 'error');
      }
    }

    function handleImportCourses() {
      try {
        const data = document.getElementById('courseData').value.trim();
        
        if (!data) {
          showNotification('错误', '请输入课程数据', 'error');
          return;
        }
        
        let importedCourses;
        try {
          importedCourses = JSON.parse(data);
        } catch (parseError) {
          showNotification('错误', 'JSON格式错误，请检查数据格式', 'error');
          return;
        }
        
        if (!Array.isArray(importedCourses)) {
          showNotification('错误', '数据格式错误，应为数组格式', 'error');
          return;
        }
        
        let successCount = 0;
        let errorCount = 0;
        
        importedCourses.forEach((courseData, index) => {
          try {
            if (!courseData.name || !courseData.category) {
              errorCount++;
              return;
            }
            
            const newCourse = {
              id: Date.now() + index,
              name: courseData.name,
              category: courseData.category,
              progress: 0,
              time: courseData.time || '待定',
              location: courseData.location || '待定',
              color: colorClasses[(courses.length + index) % colorClasses.length],
              credits: courseData.credits || 3
            };
            
            courses.push(newCourse);
            successCount++;
          } catch (error) {
            console.error('导入课程失败:', error);
            errorCount++;
          }
        });
        
        if (saveCourses()) {
          renderCourseList();
          closeImportModal();
          
          if (errorCount === 0) {
            showNotification('成功', `成功导入 ${successCount} 门课程`, 'success');
          } else {
            showNotification('部分成功', `成功导入 ${successCount} 门课程，失败 ${errorCount} 门`, 'success');
          }
        } else {
          showNotification('错误', '保存课程失败，请重试', 'error');
        }
      } catch (error) {
        console.error('导入课程失败:', error);
        showNotification('错误', '导入课程时发生错误', 'error');
      }
    }

    function showNotification(title, message, type = 'success') {
      const notification = document.getElementById('notification');
      const icon = document.getElementById('notificationIcon');
      const titleEl = document.getElementById('notificationTitle');
      const messageEl = document.getElementById('notificationMessage');
      
      titleEl.textContent = title;
      messageEl.textContent = message;
      
      if (type === 'success') {
        icon.innerHTML = '<svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>';
        icon.className = 'w-8 h-8 rounded-full flex items-center justify-center bg-success';
      } else {
        icon.innerHTML = '<svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>';
        icon.className = 'w-8 h-8 rounded-full flex items-center justify-center bg-danger';
      }
      
      notification.classList.remove('hidden');
      
      setTimeout(() => {
        notification.classList.add('hidden');
      }, 3000);
    }

    function renderCourseList() {
      const container = document.getElementById('courseList');
      
      if (courses.length === 0) {
        container.innerHTML = `
          <div class="text-center py-12">
            <svg class="w-16 h-16 mx-auto text-gray-300 dark:text-gray-600 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332-.477-4.5-1.253"></path>
            </svg>
            <p class="text-gray-500 dark:text-gray-400">暂无课程</p>
            <p class="text-sm text-gray-400 dark:text-gray-500">点击"添加课程"开始创建</p>
          </div>
        `;
        return;
      }
      
      container.innerHTML = courses.map(course => `
        <div class="course-card p-4 rounded-xl bg-white dark:bg-darkLighter border border-gray-100 dark:border-gray-700">
          <div class="flex items-center justify-between mb-3">
            <div class="flex items-center gap-3 min-w-0">
              <div class="w-10 h-10 flex-shrink-0 rounded-lg bg-gradient-to-br ${course.color} flex items-center justify-center">
                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332-.477-4.5-1.253"></path>
                </svg>
              </div>
              <div class="min-w-0">
                <h4 class="font-semibold text-gray-900 dark:text-white truncate">${course.name}</h4>
                <div class="flex items-center gap-2 text-sm text-gray-500 dark:text-gray-400 whitespace-nowrap">
                  <span class="truncate">${course.category}</span>
                  <span>•</span>
                  <span>${course.credits}学分</span>
                </div>
              </div>
            </div>
            <div class="flex items-center gap-2 flex-shrink-0">
              <button onclick="deleteCourse(${course.id})" class="p-2 hover:bg-red-50 dark:hover:bg-red-900/20 rounded-lg transition-colors group">
                <svg class="w-4 h-4 text-gray-400 group-hover:text-danger" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                </svg>
              </button>
              <div class="text-right">
                <span class="text-lg font-bold ${course.progress >= 80 ? 'text-success' : course.progress > 0 ? 'text-primary' : 'text-gray-400'}">${course.progress}%</span>
              </div>
            </div>
          </div>
          <div class="flex items-center justify-between mb-3">
            <div class="flex items-center gap-4 text-sm text-gray-500 dark:text-gray-400">
              <span class="flex items-center gap-1">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                ${course.time}
              </span>
              <span class="flex items-center gap-1">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
                </svg>
                ${course.location}
              </span>
            </div>
          </div>
          <div class="w-full h-2 bg-gray-200 dark:bg-gray-700 rounded-full overflow-hidden">
            <div class="h-full bg-gradient-to-r ${course.color} transition-all duration-500" style="width: ${course.progress}%"></div>
          </div>
        </div>
      `).join('');
      
      updateCourseStats();
    }

    function deleteCourse(courseId) {
      if (confirm('确定要删除这门课程吗？')) {
        courses = courses.filter(c => c.id !== courseId);
        if (saveCourses()) {
          renderCourseList();
          showNotification('删除', '课程已删除', 'success');
        }
      }
    }

    function updateCourseStats() {
      const total = courses.length;
      const completed = courses.filter(c => c.progress >= 80).length;
      const inProgress = total - completed;
      
      document.querySelector('.glass.dark\\:glass-dark:nth-child(1) h3').textContent = total;
      document.querySelector('.glass.dark\\:glass-dark:nth-child(2) h3').textContent = completed;
      document.querySelector('.glass.dark\\:glass-dark:nth-child(3) h3').textContent = inProgress;
    }

    function navigateTo(page) {
      window.location.href = page;
    }

    document.addEventListener('DOMContentLoaded', () => {
      CF.seedIfEmpty();
      loadCourses();
      renderCourseList();
    });
  </script>
</body>
</html>
