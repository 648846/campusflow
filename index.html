  <script>
    /* ==========================================================================
       仪表盘脚本
       所有数字均来自 localStorage 真实数据（assets/js/store.js 统一口径），
       不再存在硬编码的"24 门课 / 156h / 78%"这类示例值。
       ========================================================================== */
    CF.seedIfEmpty();

    var courses = CF.getCourses();
    var statsData = CF.stats();
    var progressChart = null;
    var categoryChart = null;

    var CAT_COLORS = ['#6366f1', '#8b5cf6', '#f59e0b', '#10b981', '#06b6d4', '#ef4444'];

    /* --------------------------------- 工具函数 -------------------------------- */

    function escapeHtml(str) {
      return String(str == null ? '' : str).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function toast(message, type) {
      var box = document.createElement('div');
      var color = type === 'error' ? 'bg-danger' : 'bg-gray-900 dark:bg-gray-700';
      box.className = 'fixed left-1/2 -translate-x-1/2 bottom-24 lg:bottom-8 z-[60] ' + color +
        ' text-white text-sm px-5 py-3 rounded-xl shadow-2xl transition-opacity duration-300';
      box.textContent = message;
      document.body.appendChild(box);
      setTimeout(function () { box.style.opacity = '0'; }, 2200);
      setTimeout(function () { box.remove(); }, 2600);
    }

    /* --------------------------------- 统计卡片 -------------------------------- */

    function renderStats() {
      var s = statsData;

      document.getElementById('statCourses').textContent = s.courseCount;
      document.getElementById('statFocus').textContent = s.totalHours + 'h';
      document.getElementById('statTasks').textContent = s.taskDone;
      document.getElementById('statProgress').textContent = s.avgProgress + '%';

      document.getElementById('badgeCourses').textContent = '共 ' + s.courseCount + ' 门';
      document.getElementById('badgeFocus').textContent = '本周 ' + s.weekHours + 'h';
      document.getElementById('badgeTasks').textContent = '待办 ' + s.taskPending;
      document.getElementById('badgeProgress').textContent = s.streak > 0 ? '连续 ' + s.streak + ' 天' : '今日未记录';

    }

    /* --------------------------------- 今日安排 -------------------------------- */

    function emptyState(text, hint) {
      return '<div class="py-8 text-center">' +
        '<p class="text-gray-500 dark:text-gray-400 text-sm">' + escapeHtml(text) + '</p>' +
        (hint ? '<p class="text-xs text-gray-400 dark:text-gray-500 mt-1">' + escapeHtml(hint) + '</p>' : '') +
        '</div>';
    }

    function renderTodayPlan() {
      var container = document.getElementById('todayCourses');
      var todayList = CF.todayCourses();
      var tasksToday = statsData.todayTasks;

      document.getElementById('todayPlanMeta').textContent =
        todayList.length + ' 节课 · ' + tasksToday.length + ' 项今日待办';

      var html = '';

      todayList.forEach(function (course) {
        html += '<div class="course-card flex items-center gap-4 p-4 rounded-xl bg-white dark:bg-darkLighter border border-gray-100 dark:border-gray-700">' +
          '<div class="w-12 h-12 rounded-xl bg-gradient-to-br ' + course.color + ' flex items-center justify-center flex-shrink-0">' +
            '<svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">' +
              '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332-.477-4.5-1.253"/></svg>' +
          '</div>' +
          '<div class="flex-1 min-w-0">' +
            '<h4 class="font-semibold text-gray-900 dark:text-white truncate">' + escapeHtml(course.name) + '</h4>' +
            '<div class="flex items-center gap-2 text-sm text-gray-500 dark:text-gray-400 whitespace-nowrap">' +
              '<span>' + escapeHtml(String(course.time).replace(/^周[一二三四五六日]\s*/, '')) + '</span>' +
              '<span>•</span><span>' + escapeHtml(course.location) + '</span>' +
            '</div>' +
          '</div>' +
          '<span class="text-xs px-2.5 py-1 rounded-full bg-primary/10 text-primary flex-shrink-0">课程</span>' +
        '</div>';
      });

      tasksToday.forEach(function (task) {
        var urgent = task.priority === 'high';
        html += '<div class="course-card flex items-center gap-4 p-4 rounded-xl bg-white dark:bg-darkLighter border border-gray-100 dark:border-gray-700">' +
          '<div class="w-12 h-12 rounded-xl flex items-center justify-center flex-shrink-0 ' +
            (urgent ? 'bg-danger/10 text-danger' : 'bg-accent/10 text-accent') + '">' +
            '<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">' +
              '<path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2m-6 9 2 2 4-4"/></svg>' +
          '</div>' +
          '<div class="flex-1 min-w-0">' +
            '<h4 class="font-semibold text-gray-900 dark:text-white truncate">' + escapeHtml(task.title) + '</h4>' +
            '<div class="text-sm text-gray-500 dark:text-gray-400 whitespace-nowrap truncate">' +
              escapeHtml(task.course) + ' · ' + escapeHtml(task.dueDate) +
            '</div>' +
          '</div>' +
          '<span class="text-xs px-2.5 py-1 rounded-full flex-shrink-0 ' +
            (urgent ? 'bg-danger/10 text-danger' : 'bg-accent/10 text-accent') + '">待办</span>' +
        '</div>';
      });

      container.innerHTML = html || emptyState('今天没有排课，也没有到期任务', '打开「专注模式」安排一次 25 分钟的复习吧');
    }

    /* --------------------------------- 待办提醒 -------------------------------- */

    function renderReminders() {
      var container = document.getElementById('recentCourses');
      var order = { high: 0, medium: 1, low: 2 };
      // 今日到期的任务已出现在左侧「今日安排」，这里只列之后要处理的，避免重复
      var pending = CF.getTasks().filter(function (t) {
        return !t.completed && String(t.dueDate || '').indexOf('今天') !== 0;
      })
        .sort(function (a, b) {
          var oa = order[a.priority] === undefined ? 2 : order[a.priority];
          var ob = order[b.priority] === undefined ? 2 : order[b.priority];
          return oa - ob;
        })
        .slice(0, 4);

      document.getElementById('reminderMeta').textContent = statsData.taskPending + ' 项未完成';

      if (!pending.length) {
        container.innerHTML = emptyState('没有更晚的待办', '今日任务已列在左侧「今日安排」中');
        return;
      }

      container.innerHTML = pending.map(function (task) {
        var color = task.priority === 'high' ? 'text-danger bg-danger/10'
          : task.priority === 'medium' ? 'text-accent bg-accent/10'
          : 'text-success bg-success/10';
        var label = task.priority === 'high' ? '高' : task.priority === 'medium' ? '中' : '低';
        return '<div class="course-card flex items-center gap-4 p-4 rounded-xl bg-white dark:bg-darkLighter border border-gray-100 dark:border-gray-700">' +
          '<span class="w-8 h-8 rounded-lg flex items-center justify-center text-xs font-bold flex-shrink-0 ' + color + '">' + label + '</span>' +
          '<div class="flex-1 min-w-0">' +
            '<h4 class="font-semibold text-gray-900 dark:text-white truncate">' + escapeHtml(task.title) + '</h4>' +
            '<p class="text-sm text-gray-500 dark:text-gray-400 truncate">' + escapeHtml(task.course) + ' · ' + escapeHtml(task.dueDate) + '</p>' +
          '</div>' +
        '</div>';
      }).join('');
    }

    /* ------------------------------- 需要重点关注的课程 ------------------------------ */

    function renderAttention() {
      var container = document.getElementById('recommendedCourses');
      var list = CF.attentionCourses(3);

      if (!list.length) {
        container.innerHTML = emptyState('还没有课程数据', '去「课程管理」添加本学期课程');
        return;
      }

      container.innerHTML = list.map(function (course) {
        var p = Number(course.progress) || 0;
        var advice = p < 30 ? '进度落后，建议本周安排 2 次专注'
          : p < 60 ? '进度偏慢，安排一次专项复习'
          : '接近完成，保持当前节奏';
        return '<div class="course-card p-6 rounded-xl bg-white dark:bg-darkLighter border border-gray-100 dark:border-gray-700">' +
          '<div class="flex items-center gap-3 mb-4">' +
            '<div class="w-11 h-11 rounded-xl bg-gradient-to-br ' + course.color + ' flex items-center justify-center flex-shrink-0">' +
              '<svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">' +
                '<path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7Z"/></svg>' +
            '</div>' +
            '<div class="min-w-0">' +
              '<h4 class="font-bold text-gray-900 dark:text-white truncate">' + escapeHtml(course.name) + '</h4>' +
              '<p class="text-xs text-gray-500 dark:text-gray-400 truncate">' + escapeHtml(course.category) + '</p>' +
            '</div>' +
          '</div>' +
          '<div class="flex items-center justify-between text-sm mb-2">' +
            '<span class="text-gray-500 dark:text-gray-400">当前进度</span>' +
            '<span class="font-semibold text-primary">' + p + '%</span>' +
          '</div>' +
          '<div class="w-full h-2 bg-gray-200 dark:bg-gray-700 rounded-full overflow-hidden mb-3">' +
            '<div class="h-full bg-gradient-to-r ' + course.color + '" style="width:' + p + '%"></div>' +
          '</div>' +
          '<p class="text-xs text-gray-500 dark:text-gray-400">' + advice + '</p>' +
        '</div>';
      }).join('');
    }

    /* --------------------------------- 课程进度 -------------------------------- */

    function renderProgressList(filter) {
      var container = document.getElementById('progressList');
      var filteredCourses = courses;

      if (filter === 'completed') {
        filteredCourses = courses.filter(function (c) { return c.progress >= 80; });
      } else if (filter === 'inprogress') {
        filteredCourses = courses.filter(function (c) { return c.progress > 0 && c.progress < 80; });
      } else if (filter === 'notstarted') {
        filteredCourses = courses.filter(function (c) { return c.progress === 0; });
      }

      if (!filteredCourses.length) {
        container.innerHTML = emptyState('这个分类下还没有课程');
        return;
      }

      container.innerHTML = filteredCourses.map(function (course) {
        return '<div class="course-card p-4 rounded-xl bg-white dark:bg-darkLighter border border-gray-100 dark:border-gray-700">' +
          '<div class="flex items-center justify-between gap-3 mb-3">' +
            '<div class="flex items-center gap-3 min-w-0">' +
              '<div class="w-10 h-10 rounded-lg bg-gradient-to-br ' + course.color + ' flex items-center justify-center flex-shrink-0">' +
                '<svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">' +
                  '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332-.477-4.5-1.253"/></svg>' +
              '</div>' +
              '<div class="min-w-0">' +
                '<h4 class="font-semibold text-gray-900 dark:text-white truncate">' + escapeHtml(course.name) + '</h4>' +
                '<p class="text-sm text-gray-500 dark:text-gray-400 truncate">' + escapeHtml(course.category) + '</p>' +
              '</div>' +
            '</div>' +
            '<div class="text-right flex-shrink-0">' +
              '<span class="text-lg font-bold ' + (course.progress >= 80 ? 'text-success' : course.progress > 0 ? 'text-primary' : 'text-gray-400') + '">' + course.progress + '%</span>' +
              '<p class="text-xs text-gray-500 dark:text-gray-400">' + (course.progress >= 80 ? '已完成' : course.progress > 0 ? '进行中' : '未开始') + '</p>' +
            '</div>' +
          '</div>' +
          '<div class="w-full h-2 bg-gray-200 dark:bg-gray-700 rounded-full overflow-hidden">' +
            '<div class="h-full bg-gradient-to-r ' + course.color + ' transition-all duration-500" style="width: ' + course.progress + '%"></div>' +
          '</div>' +
        '</div>';
      }).join('');
    }

    function filterCourses(filter) {
      var buttons = document.querySelectorAll('.category-badge');
      buttons.forEach(function (btn) {
        btn.classList.remove('bg-primary', 'text-white');
        btn.classList.add('bg-gray-200', 'dark:bg-gray-700', 'text-gray-700', 'dark:text-gray-300');
      });
      if (window.event && window.event.target) {
        window.event.target.classList.remove('bg-gray-200', 'dark:bg-gray-700', 'text-gray-700', 'dark:text-gray-300');
        window.event.target.classList.add('bg-primary', 'text-white');
      }
      renderProgressList(filter);
    }

    /* ---------------------------------- 图表 ---------------------------------- */

    function initCharts() {
      var s = statsData;
      var isDark = document.documentElement.classList.contains('dark');
      var gridColor = isDark ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.05)';
      var tickColor = isDark ? '#94a3b8' : '#64748b';

      var progressCtx = document.getElementById('progressChart').getContext('2d');
      progressChart = new Chart(progressCtx, {
        type: 'line',
        data: {
          labels: s.last7.map(function (d) { return d.label; }),
          datasets: [{
            label: '专注时长（小时）',
            data: s.last7.map(function (d) { return Math.round(d.minutes / 60 * 10) / 10; }),
            borderColor: '#6366f1',
            backgroundColor: 'rgba(99, 102, 241, 0.1)',
            fill: true,
            tension: 0.4,
            pointBackgroundColor: '#6366f1',
            pointBorderColor: '#fff',
            pointBorderWidth: 2,
            pointRadius: 4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: function (ctx) {
                  var mins = s.last7[ctx.dataIndex].minutes;
                  return mins >= 60 ? (Math.round(mins / 6) / 10) + ' 小时' : mins + ' 分钟';
                }
              }
            }
          },
          scales: {
            y: { beginAtZero: true, grid: { color: gridColor }, ticks: { color: tickColor } },
            x: { grid: { display: false }, ticks: { color: tickColor } }
          }
        }
      });

      var catLabels = s.categories.length ? s.categories.map(function (c) { return c.name; }) : ['暂无课程'];
      var catData = s.categories.length ? s.categories.map(function (c) { return c.count; }) : [1];
      var catColors = s.categories.length
        ? s.categories.map(function (_, i) { return CAT_COLORS[i % CAT_COLORS.length]; })
        : ['#cbd5e1'];

      var categoryCtx = document.getElementById('categoryChart').getContext('2d');
      categoryChart = new Chart(categoryCtx, {
        type: 'doughnut',
        data: {
          labels: catLabels,
          datasets: [{ data: catData, backgroundColor: catColors, borderWidth: 0 }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'bottom',
              labels: { padding: 16, usePointStyle: true, color: tickColor, boxWidth: 8 }
            }
          },
          cutout: '70%'
        }
      });
    }

    /* ------------------------------- 数据备份与隐私 ------------------------------ */

    function exportBackup() {
      var data = CF.exportAll();
      var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'campusflow-backup-' + CF.todayKey() + '.json';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      toast('备份已导出');
    }

    function triggerImport() {
      document.getElementById('importFile').click();
    }

    function handleImport(event) {
      var file = event.target.files && event.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function (e) {
        var result = CF.importAll(e.target.result);
        if (result.ok) {
          toast(result.message);
          setTimeout(function () { location.reload(); }, 700);
        } else {
          toast(result.message, 'error');
        }
      };
      reader.onerror = function () { toast('文件读取失败', 'error'); };
      reader.readAsText(file);
      event.target.value = '';
    }

    function clearAllData() {
      var ok = confirm('确定清空全部本地数据？\n\n此操作不可撤销，建议先导出备份。');
      if (!ok) return;
      CF.clearAll();
      location.reload();
    }

    /* ---------------------------------- 基础 ---------------------------------- */

    function navigateTo(page) {
      window.location.href = page;
    }

    function initTheme() {
      var themeToggle = document.getElementById('themeToggle');
      if (!themeToggle) return;
      themeToggle.addEventListener('click', function () {
        var dark = document.documentElement.classList.toggle('dark');
        localStorage.setItem('theme', dark ? 'dark' : 'light');
      });
    }

    document.addEventListener('DOMContentLoaded', function () {
      initTheme();
      renderStats();
      renderTodayPlan();
      renderReminders();
      renderAttention();
      renderProgressList('all');
      initCharts();

      var importInput = document.getElementById('importFile');
      if (importInput) importInput.addEventListener('change', handleImport);
    });
  </script>
</body>
</html>
